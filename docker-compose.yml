services:
  backend:
    build: .
    container_name: node_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PG_HOST=db
      - PG_USER=attakhan
      - PG_PASSWORD=1234
      - PG_PORT=5432
      - PG_DATABASE=node_app
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: node_postgres
    restart: always
    environment:
      POSTGRES_USER: attakhan
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: node_app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
